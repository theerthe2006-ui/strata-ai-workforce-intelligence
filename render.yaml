# Render deployment blueprint for STRATA.AI
# Backend: Python FastAPI with SQLite (free tier, no external DB needed)
# Frontend: Static site built with Vite

services:
  # Backend API Service
  - type: web
    name: strata-ai-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/backend:/opt/render/project/src
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///strata_workforce.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://strata-ai-workforce.onrender.com,https://strata-ai.onrender.com,http://localhost:5173,http://localhost:3000
      - key: ALLOWED_HOSTS
        value: "*"
    healthCheckPath: /api/v1/health

  # Frontend Static Site
  - type: web
    name: strata-ai-workforce
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://strata-ai-api.onrender.com
